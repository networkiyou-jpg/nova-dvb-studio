name: Build NOVA DVB Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/NOVA.Tests/NOVA.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish app and engine
        run: |
          dotnet publish src/NOVA.UI/NOVA.UI.csproj -c Release -r win-x64 --self-contained true -o publish
          dotnet publish src/NOVA.DVB.Host/NOVA.DVB.Host.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\nova.iss

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-DVB-Studio-Setup
          path: artifacts/*.exe
          if-no-files-found: error
