/* NOVA DVB Studio design tokens.
   Layout concept: a broadcast control desk. Fixed chrome (top nav, sidebar, status strip),
   one dominant picture, and quiet instrument cards around it.
   Themes only change tokens, so every screen stays theme-independent. */
:root {
  color-scheme: dark;
  /* Ground */
  --bg-0: #070b18;
  --bg-1: #0b1020;
  --bg-2: #101729;
  --surface: rgba(16, 23, 44, .74);
  --surface-2: rgba(25, 33, 62, .62);
  --surface-3: rgba(38, 47, 84, .55);
  --surface-solid: #121a31;
  --field: rgba(9, 14, 30, .72);
  /* Lines */
  --line: rgba(137, 146, 214, .17);
  --line-2: rgba(137, 146, 214, .3);
  --edge-a: rgba(120, 104, 240, .55);
  --edge-b: rgba(40, 184, 255, .3);
  /* Text */
  --fg: #f3f5fa;
  --fg-2: #a3adc2;
  --fg-3: #7d88a3;
  --on-accent: #ffffff;
  /* Accents */
  --accent: #7868f0;
  --accent-deep: #5a3ff0;
  --accent-2: #28b8ff;
  --accent-3: #25d9d0;
  --glow: rgba(120, 104, 240, .5);
  --glow-2: rgba(40, 184, 255, .3);
  --grad: linear-gradient(100deg, var(--accent-deep), #8a5cf6);
  --grad-soft: linear-gradient(100deg, rgba(90, 63, 240, .34), rgba(138, 92, 246, .14));
  --grad-meter: linear-gradient(90deg, var(--accent-3), #2bd98f);
  /* States, kept apart from the accent */
  --good: #2fdc9a;
  --good-bg: rgba(47, 220, 154, .13);
  --warn: #ffb648;
  --warn-bg: rgba(255, 182, 72, .13);
  --bad: #ff5468;
  --bad-bg: rgba(255, 84, 104, .14);
  --star: #ffb020;
  /* Shape */
  --r-card: 16px;
  --r-ctl: 10px;
  --r-pill: 999px;
  --stroke: 1.7;
  /* Scale */
  --ui: 1;
  --pad: 16px;
  --row: 36px;
  /* Type */
  --font-display: "Outfit", "Segoe UI Variable Display", "Segoe UI", "Inter Display", Inter, system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
  --font-ar: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "DejaVu Sans", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
}

/* NOVA Purple: warmer violet ground, the accent carries more weight */
[data-nova-theme="purple"] {
  --bg-0: #0d0817; --bg-1: #130b22; --bg-2: #1b1030;
  --surface: rgba(32, 19, 58, .74); --surface-2: rgba(46, 29, 82, .6); --surface-3: rgba(62, 40, 108, .55);
  --surface-solid: #1f1436; --field: rgba(16, 9, 30, .72);
  --line: rgba(176, 140, 240, .18); --line-2: rgba(176, 140, 240, .32);
  --edge-a: rgba(176, 106, 255, .6); --edge-b: rgba(232, 121, 249, .28);
  --accent: #a56bff; --accent-deep: #7a30ec; --accent-2: #e879f9; --accent-3: #8f9bff;
  --glow: rgba(165, 107, 255, .5); --glow-2: rgba(232, 121, 249, .25);
  --grad: linear-gradient(100deg, #7a30ec, #c04ee6);
  --grad-soft: linear-gradient(100deg, rgba(122, 48, 236, .36), rgba(192, 78, 230, .14));
  --grad-meter: linear-gradient(90deg, #8f9bff, #d683ff);
  --fg-2: #b3a8c9; --fg-3: #8c80a6;
}

/* NOVA Blue: broadcast-monitor blue, no violet */
[data-nova-theme="blue"] {
  --bg-0: #050d1a; --bg-1: #081426; --bg-2: #0d1d36;
  --surface: rgba(12, 28, 54, .74); --surface-2: rgba(19, 41, 76, .6); --surface-3: rgba(28, 56, 102, .55);
  --surface-solid: #0e2140; --field: rgba(5, 13, 28, .72);
  --line: rgba(110, 170, 230, .18); --line-2: rgba(110, 170, 230, .32);
  --edge-a: rgba(40, 150, 255, .6); --edge-b: rgba(37, 217, 208, .3);
  --accent: #2f9bff; --accent-deep: #1766e0; --accent-2: #25d9d0; --accent-3: #5fd0ff;
  --glow: rgba(47, 155, 255, .5); --glow-2: rgba(37, 217, 208, .25);
  --grad: linear-gradient(100deg, #1766e0, #27a4ff);
  --grad-soft: linear-gradient(100deg, rgba(23, 102, 224, .36), rgba(39, 164, 255, .14));
  --grad-meter: linear-gradient(90deg, #25d9d0, #2f9bff);
  --fg-2: #a0b2c9; --fg-3: #7a8ea8;
}

/* NOVA Neon: the loudest theme, deep black with cyan and magenta edges */
[data-nova-theme="neon"] {
  --bg-0: #04050c; --bg-1: #070814; --bg-2: #0c0e1f;
  --surface: rgba(11, 13, 32, .78); --surface-2: rgba(19, 22, 52, .62); --surface-3: rgba(28, 32, 74, .55);
  --surface-solid: #0e1026; --field: rgba(4, 5, 14, .78);
  --line: rgba(0, 240, 225, .17); --line-2: rgba(0, 240, 225, .34);
  --edge-a: rgba(0, 240, 225, .65); --edge-b: rgba(255, 60, 200, .45);
  --accent: #00e5d8; --accent-deep: #00a9c9; --accent-2: #ff3cc8; --accent-3: #7dff9b;
  --on-accent: #03121a;
  --glow: rgba(0, 229, 216, .5); --glow-2: rgba(255, 60, 200, .3);
  --grad: linear-gradient(100deg, #00d2d3, #24f0c0);
  --grad-soft: linear-gradient(100deg, rgba(0, 229, 216, .22), rgba(255, 60, 200, .1));
  --grad-meter: linear-gradient(90deg, #7dff9b, #00e5d8);
  --fg-2: #a4b4c4; --fg-3: #7b8c9e;
}

/* NOVA Midnight: the calmest theme for dark rooms, almost no glow */
[data-nova-theme="midnight"] {
  --bg-0: #05070e; --bg-1: #080b14; --bg-2: #0c101c;
  --surface: rgba(13, 17, 29, .88); --surface-2: rgba(20, 25, 40, .75); --surface-3: rgba(30, 36, 56, .7);
  --surface-solid: #0f1422; --field: rgba(5, 7, 14, .8);
  --line: rgba(140, 150, 180, .13); --line-2: rgba(140, 150, 180, .25);
  --edge-a: rgba(140, 150, 180, .22); --edge-b: rgba(140, 150, 180, .12);
  --accent: #8d9dd6; --accent-deep: #4c5a93; --accent-2: #7fa8d9; --accent-3: #6fc7bd;
  --glow: rgba(141, 157, 214, .14); --glow-2: rgba(127, 168, 217, .08);
  --grad: linear-gradient(100deg, #434f85, #5c6aa6);
  --grad-soft: linear-gradient(100deg, rgba(76, 90, 147, .3), rgba(92, 106, 166, .1));
  --grad-meter: linear-gradient(90deg, #6fc7bd, #7fa8d9);
  --fg-2: #a0a8bb; --fg-3: #7b8498;
}

/* NOVA Light: studio daylight, same structure, cool paper ground */
[data-nova-theme="light"] {
  color-scheme: light;
  --bg-0: #e8ebf6; --bg-1: #eef0f9; --bg-2: #f5f6fc;
  --surface: rgba(255, 255, 255, .8); --surface-2: rgba(240, 242, 251, .9); --surface-3: rgba(226, 230, 246, .95);
  --surface-solid: #ffffff; --field: rgba(255, 255, 255, .95);
  --line: rgba(66, 72, 130, .15); --line-2: rgba(66, 72, 130, .3);
  --edge-a: rgba(96, 78, 226, .32); --edge-b: rgba(20, 140, 220, .2);
  --fg: #171c33; --fg-2: #4b536e; --fg-3: #626b86;
  --accent: #5a45e0; --accent-deep: #4c35d6; --accent-2: #0b7fc4; --accent-3: #0a8f88;
  --glow: rgba(90, 69, 224, .2); --glow-2: rgba(11, 127, 196, .12);
  --grad: linear-gradient(100deg, #4c35d6, #7a4fe8);
  --grad-soft: linear-gradient(100deg, rgba(90, 69, 224, .16), rgba(122, 79, 232, .06));
  --grad-meter: linear-gradient(90deg, #0a9f96, #18b070);
  --good: #0a8a5c; --good-bg: rgba(10, 138, 92, .12);
  --warn: #a86400; --warn-bg: rgba(168, 100, 0, .12);
  --bad: #cf2439; --bad-bg: rgba(207, 36, 57, .1);
  --star: #d98a00;
}

/* User overrides from the Skins screen */
[data-cards="sharp"] { --r-card: 6px; --r-ctl: 5px; }
[data-cards="round"] { --r-card: 24px; --r-ctl: 14px; }
[data-icons="fine"] { --stroke: 1.3; }
[data-icons="bold"] { --stroke: 2.2; }
[data-density="compact"] { --pad: 11px; --row: 30px; }
[data-density="comfy"] { --pad: 20px; --row: 42px; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg-0); color: var(--fg);
  font-family: var(--font-body); font-size: calc(14px * var(--ui)); line-height: 1.35;
  font-variant-numeric: tabular-nums; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
html[lang="ar"] body { font-family: var(--font-ar); }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; }
svg.i { width: 1em; height: 1em; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: var(--stroke); stroke-linecap: round; stroke-linejoin: round; }
svg.i.fill { fill: currentColor; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.mono { font-family: var(--font-mono); font-size: .93em; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent); color: var(--on-accent); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* App frame */
.backdrop { position: fixed; inset: 0; z-index: 0; background: linear-gradient(180deg, var(--bg-1), var(--bg-0)); }
.backdrop::before, .backdrop::after { content: ""; position: absolute; border-radius: 50%; filter: blur(70px); }
.backdrop::before { width: 46vw; height: 38vh; inset-inline-start: -14vw; bottom: -16vh; background: var(--glow); opacity: .75; }
.backdrop::after { width: 40vw; height: 30vh; inset-inline-end: -12vw; top: -14vh; background: var(--glow-2); opacity: .75; }
[data-bg="plain"] .backdrop::before, [data-bg="plain"] .backdrop::after { display: none; }
[data-bg="grid"] .backdrop { background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px), linear-gradient(180deg, var(--bg-1), var(--bg-0)); background-size: 44px 44px, 44px 44px, 100% 100%; }
.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }

/* Top bar */
.top { position: relative; display: flex; align-items: stretch; gap: 14px; height: 104px; padding-inline: 20px 18px; background: linear-gradient(180deg, color-mix(in srgb, var(--bg-2) 80%, transparent), transparent); }
.top-art { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
[dir="rtl"] .top-art { transform: scaleX(-1); }
.brand { position: relative; display: flex; align-items: center; gap: 12px; flex: none; text-align: start; padding-inline-end: 6px; }
.brand-mark { width: 80px; height: 66px; flex: none; }
.brand-word b { display: block; font: 700 31px/1 var(--font-display); letter-spacing: .09em; background: linear-gradient(180deg, #fff, #b9c0dc); -webkit-background-clip: text; background-clip: text; color: transparent; }
[data-nova-theme="light"] .brand-word b { background: linear-gradient(180deg, #2a2f52, #4c35d6); -webkit-background-clip: text; background-clip: text; }
.brand-word span { display: block; font: 400 24px/1.12 var(--font-display); letter-spacing: .02em; }
.brand-word small { display: block; font-size: 13px; color: var(--fg-2); margin-block-start: 3px; white-space: nowrap; }
.nav { position: relative; flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: space-evenly; gap: clamp(0px, .5vw, 8px); padding-inline: 16px 56px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav button { flex: 0 0 auto; display: grid; justify-items: center; gap: 5px; min-width: 76px; padding: 9px 11px 8px; border-radius: 12px; border: 1px solid transparent; color: var(--fg); font-size: 14.5px; white-space: nowrap; transition: background .18s, border-color .18s, color .18s, transform .18s; }
.nav button svg { font-size: 29px; color: var(--fg); opacity: .9; }
.nav button:hover { background: var(--surface-2); border-color: var(--line); }
.nav button[aria-current="page"] { background: linear-gradient(170deg, #5a3ff0cc, #7a4ff0aa); background: linear-gradient(170deg, color-mix(in srgb, var(--accent-deep) 85%, transparent), color-mix(in srgb, var(--accent) 60%, transparent)); border-color: color-mix(in srgb, var(--accent) 80%, white 20%); box-shadow: 0 0 22px var(--glow), inset 0 1px 0 rgba(255, 255, 255, .22); color: var(--on-accent); }
.nav button[aria-current="page"] svg { color: var(--on-accent); opacity: 1; }
.top-end { position: relative; flex: none; display: grid; justify-items: end; align-content: start; gap: 2px; padding-block-start: 8px; min-width: 132px; }
.winbar { display: flex; gap: 2px; margin-block-end: 2px; }
.winbar button { width: 30px; height: 26px; display: grid; place-items: center; border-radius: 7px; font-size: 16px; color: var(--fg); }
.winbar button:hover { background: var(--surface-3); }
.winbar button.x:hover { background: var(--bad); color: #fff; }
.clock { font: 700 28px/1.05 var(--font-display); letter-spacing: .01em; }
.date { font-size: 14.5px; color: var(--fg); white-space: nowrap; }

/* Body */
.body { position: relative; min-height: 0; display: grid; grid-template-columns: 262px minmax(0, 1fr); gap: 16px; padding: 12px 12px 6px; }
.theater .body { grid-template-columns: minmax(0, 1fr); }
.theater .side { display: none; }
.no-side .body { grid-template-columns: minmax(0, 1fr); }
.no-side .side { display: none; }

/* Glass card: the outline fades from purple to blue, like a monitor bezel catching light */
.card { position: relative; background: var(--surface); border-radius: var(--r-card); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); box-shadow: 0 10px 28px rgba(2, 4, 14, .28); min-width: 0; }
[data-nova-theme="light"] .card { box-shadow: 0 8px 22px rgba(60, 66, 130, .1); }
.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(135deg, var(--edge-a), var(--edge-b) 45%, var(--line) 70%, var(--edge-a)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); pointer-events: none; }
.card-head { display: flex; align-items: center; gap: 10px; min-height: 26px; }
.card-head h2 { font: 600 16px/1.2 var(--font-display); }
.card-head .i { font-size: 21px; }
.card-head .sp { flex: 1; }
.sub { color: var(--fg-2); }

/* Sidebar */
.side { display: flex; flex-direction: column; padding: 14px 10px 0; overflow: hidden; min-height: 0; }
.side-nav { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; align-content: start; overflow-y: auto; scrollbar-width: none; min-height: 0; flex: 0 1 auto; padding: 2px; }
.side-nav button { display: flex; align-items: center; min-width: 0; gap: 14px; height: 42.5px; flex: none; padding-inline: 16px 12px; border-radius: 11px; color: var(--fg); font-size: 15.5px; border: 1px solid transparent; text-align: start; transition: background .16s, transform .16s; white-space: nowrap; }
.side-nav button .i { font-size: 23px; opacity: .92; }
.side-nav button:hover { background: var(--surface-2); }
.side-nav button span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.side-nav button .chev { margin-inline-start: auto; font-size: 17px; display: none; }
[dir="rtl"] .side-nav button .chev { transform: scaleX(-1); }
.side-nav button[aria-current="page"] { background: var(--grad); border-color: color-mix(in srgb, var(--accent) 70%, white 30%); color: var(--on-accent); box-shadow: 0 0 18px var(--glow); }
.side-nav button[aria-current="page"] .chev { display: block; }
.side-foot { position: relative; margin-block-start: auto; display: grid; justify-items: center; text-align: center; padding-block-end: 12px; flex: 1 1 0; min-height: 0; align-content: end; overflow: hidden; }
.side-foot svg.dish { width: 200px; height: auto; flex: 1 1 auto; min-height: 0; max-height: 190px; filter: drop-shadow(0 8px 22px var(--glow)); }
.side-foot b { font: 600 16.5px/1.2 var(--font-display); }
.side-foot small { color: var(--fg-2); font-size: 12px; }

/* Main view */
.main { min-width: 0; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; animation: view-in .22s ease-out; }
@keyframes view-in { from { opacity: 0; transform: translateY(5px); } }
.scroll { overflow-y: auto; overflow-x: hidden; }

/* Live screen */
.live { display: grid; gap: 10px 16px; grid-template-columns: minmax(0, 1fr) 396px; grid-template-rows: minmax(250px, 1fr) auto auto; grid-template-areas: "video list" "now now" "cards cards"; height: 100%; }
.live.no-list { grid-template-columns: minmax(0, 1fr); grid-template-areas: "video" "now" "cards"; }
.live.no-video { grid-template-columns: minmax(0, 1fr); grid-template-areas: "list" "now" "cards"; }
.live.no-video.no-list { grid-template-rows: auto auto minmax(0, 1fr); }
.theater .live { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "video"; }
.theater .live > :not(.vid) { display: none; }
.vid { grid-area: video; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.vid-head { display: flex; align-items: center; gap: 12px; padding: 9px 12px 9px 20px; padding-inline: 20px 12px; }
.vid-head .i.tv { font-size: 25px; }
.vid-head h2 { font: 600 18px/1.2 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vid-head .sp { flex: 1; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; flex: none; border-radius: 9px; font-size: 19px; color: var(--fg); transition: background .15s, color .15s, transform .12s; }
.icon-btn:hover:not(:disabled) { background: var(--surface-3); }
.icon-btn:active:not(:disabled) { transform: scale(.93); }
.icon-btn:disabled { opacity: .4; }
.stage { position: relative; flex: 1; min-height: 0; margin: 0 9px 9px; border-radius: calc(var(--r-card) - 7px); overflow: hidden; background: #03050c; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.stage[data-aspect="16:9"] canvas { inset: 0; margin: auto; aspect-ratio: 16/9; max-width: 100%; max-height: 100%; width: auto; height: 100%; object-fit: fill; }
.stage[data-aspect="4:3"] canvas { inset: 0; margin: auto; aspect-ratio: 4/3; max-width: 100%; max-height: 100%; width: auto; height: 100%; object-fit: fill; }
.stage[data-aspect="21:9"] canvas { inset: 0; margin: auto; aspect-ratio: 21/9; max-width: 100%; height: auto; max-height: 100%; width: 100%; object-fit: fill; }
.osd-tl { position: absolute; inset-block-start: 24px; inset-inline-start: 26px; display: flex; align-items: center; gap: 8px; }
.osd-tl .picon { --s: 32px; width: auto; }
.osd-name { font: 600 14px var(--font-display); background: rgba(5, 8, 20, .62); color: #fff; padding: 5px 10px; border-radius: 6px; }
.osd-tr { position: absolute; inset-block-start: 24px; inset-inline-end: 26px; display: flex; gap: 8px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 6px; font: 700 12px/1.4 var(--font-body); letter-spacing: .04em; white-space: nowrap; }
.tag.live { background: #e0222f; color: #fff; font-size: 16px; padding: 3px 10px; letter-spacing: .02em; }
.tag.rec { background: rgba(5, 8, 20, .7); color: #ff6b78; }
.tag.rec i { width: 9px; height: 9px; border-radius: 50%; background: #ff3b4e; animation: blink 1.2s steps(2) infinite; }
.tag.demo { background: rgba(255, 182, 72, .92); color: #241600; }
@keyframes blink { 50% { opacity: .2; } }
.controls { position: absolute; inset-inline: 0; bottom: 0; display: flex; align-items: center; gap: 6px; padding: 28px 16px 8px; background: linear-gradient(0deg, rgba(3, 5, 14, .86), transparent); color: #fff; transition: opacity .25s; }
.controls .icon-btn { color: #fff; font-size: 23px; width: 38px; height: 38px; }
.controls .icon-btn:hover:not(:disabled) { background: rgba(255, 255, 255, .14); }
.vol { flex: 0 1 376px; min-width: 60px; }
.chip-btn { height: 28px; min-width: 34px; padding-inline: 7px; display: inline-grid; place-items: center; border-radius: 6px; font: 700 12.5px var(--font-body); }
.chip-btn:hover { background: rgba(255, 255, 255, .14); }
.chip-btn.solid { background: #fff; color: #0b1020; }
.chip-btn.solid:hover { background: #dfe3ff; }
.chip-btn.outline { box-shadow: inset 0 0 0 1.6px rgba(255, 255, 255, .85); }
.controls .sp { flex: 1; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; cursor: pointer; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(90deg, var(--accent) var(--val, 50%), rgba(150, 160, 200, .34) var(--val, 50%)); }
[dir="rtl"] input[type="range"]::-webkit-slider-runnable-track { background: linear-gradient(270deg, var(--accent) var(--val, 50%), rgba(150, 160, 200, .34) var(--val, 50%)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4.5px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 10px var(--glow); }
input[type="range"]::-moz-range-track { height: 5px; border-radius: 5px; background: rgba(150, 160, 200, .34); }
input[type="range"]::-moz-range-progress { height: 5px; border-radius: 5px; background: var(--accent); }
input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; }

/* Stage overlays: tuning, signal lost, no device */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: radial-gradient(ellipse at center, rgba(12, 17, 36, .55), rgba(3, 5, 12, .9)); color: #f3f5fa; z-index: 1; }
.overlay.solid { background: radial-gradient(ellipse at 50% 42%, #18204a 0%, #0a0e20 50%, #05070f 100%); }
.overlay > div { display: grid; justify-items: center; gap: 8px; max-width: 460px; }
.overlay h3 { font: 600 21px/1.25 var(--font-display); }
.overlay p { color: #b6bfd4; }
.overlay .row { justify-content: center; margin-block-start: 8px; }
.radar { width: 74px; height: 74px; border-radius: 50%; position: relative; border: 1.5px solid rgba(120, 104, 240, .55); background: repeating-radial-gradient(circle, transparent 0 11px, rgba(120, 104, 240, .2) 11px 12px); overflow: hidden; }
.radar::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, transparent 70%, rgba(40, 184, 255, .85)); animation: spin 1.3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.radar.sm { width: 30px; height: 30px; background: none; }

/* Channel list */
.list { grid-area: list; display: flex; flex-direction: column; min-height: 0; padding: 14px 8px 8px 8px; gap: 10px; }
.list-pad { padding-inline: 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.search { position: relative; display: flex; align-items: center; }
.search .i { position: absolute; inset-inline-start: 11px; font-size: 18px; color: var(--fg-2); pointer-events: none; }
.search input { width: 100%; height: 36px; padding-inline: 38px 12px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--field); outline: 0; transition: border-color .15s, box-shadow .15s; }
.search input::placeholder { color: var(--fg-3); }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; min-width: 0; }
.seg button { height: 32px; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 6px; padding-inline: 5px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); font-size: 13.5px; white-space: nowrap; transition: background .15s; }
.seg button .i { font-size: 16px; }
.seg button:hover { background: var(--surface-3); }
.seg button[aria-pressed="true"] { background: var(--grad); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.ch-list { list-style: none; margin: 0; padding: 2px; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 1px; }
.ch { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 35.5px; padding-inline: 12px 6px; border-radius: 8px; text-align: start; font-size: 15px; transition: background .12s; cursor: pointer; }
.ch:hover { background: var(--surface-2); }
.ch.on { background: var(--grad); color: var(--on-accent); box-shadow: 0 0 14px var(--glow); }
.ch .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; text-align: start; }
.ch .badge { flex: none; }
.ch .star { color: var(--fg-2); font-size: 19px; width: 30px; height: 30px; }
.ch .star.on, .star.on { color: var(--star); }
.ch .star.on svg, .star.on svg { fill: currentColor; }
.ch.on .star { color: var(--on-accent); }
.ch.on .star.on { color: #ffc94a; }
.badge { display: inline-grid; place-items: center; padding: 1px 5px; min-width: 25px; border-radius: 4px; background: var(--surface-3); color: var(--fg); font: 700 10.5px/1.5 var(--font-body); box-shadow: inset 0 0 0 1px var(--line); }
.empty { padding: 26px 16px; text-align: center; color: var(--fg-2); display: grid; gap: 6px; justify-items: center; }
.empty .i { font-size: 30px; color: var(--fg-3); }

/* Picon: generated tile or the user's image */
.picon { direction: ltr; --s: 22px; height: var(--s); width: calc(var(--s) * 2.05); flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 2px; border-radius: 3px; overflow: hidden; background: var(--p1, #333); color: #fff; font: 700 calc(var(--s) * .46)/1 var(--font-display); letter-spacing: .02em; }
.picon img { width: 100%; height: 100%; object-fit: contain; display: block; background: rgba(255, 255, 255, .04); }
.picon.missing { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--fg-3); }
.picon em { font-style: normal; background: rgba(255, 255, 255, .92); color: #101729; border-radius: 2px; padding: 0 2px; }

/* Now bar */
.now { grid-area: now; display: flex; align-items: center; gap: 18px; padding: 8px 14px 8px 22px; padding-inline: 22px 14px; min-height: 62px; }
.now .picon { --s: 32px; width: 116px; }
.now-id { min-width: 0; }
.now-id b { font: 600 17px/1.25 var(--font-display); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-id small { color: var(--fg-2); font-size: 13.5px; white-space: nowrap; word-spacing: .1em; }
.vr { width: 1px; align-self: stretch; margin-block: 6px; background: var(--line); flex: none; }
.pill { flex: none; display: inline-grid; place-items: center; height: 23px; padding-inline: 9px; border-radius: 6px; font-weight: 600; font-size: 13px; }
.pill.now-p { background: var(--grad); color: var(--on-accent); }
.pill.next-p { background: var(--surface-3); color: var(--fg); }
.now-prog { flex: 1.5 1 0; min-width: 120px; display: flex; align-items: center; gap: 12px; }
.now-prog.nx { flex: .8 1 0; min-width: 100px; }
.now-id { flex: 0 1 auto; }
.now-prog .col { min-width: 0; flex: 1; display: grid; gap: 7px; }
.now-prog .col b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-prog .col small { color: var(--fg-2); white-space: nowrap; }
.prog { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 4px; background: var(--grad); }
.tm { color: var(--fg-2); font-size: 14px; white-space: nowrap; }

/* Bottom cards */
.cards3 { grid-area: cards; display: grid; gap: 16px; grid-template-columns: 1.33fr 1fr .97fr; }
.cards3.n2 { grid-template-columns: 1fr 1fr; }
.cards3.n1 { grid-template-columns: 1fr; }
.cards3 > .card { padding: 13px 18px 14px; display: grid; gap: 9px; align-content: start; }
.tune { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3.5px 10px; font-size: 14px; }
.kv dt { color: var(--fg-2); white-space: nowrap; }
.kv dd { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl-plain { margin: 0; }
.meters { display: grid; gap: 7px; align-content: start; }
.meter { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 3px 10px; font-size: 14px; }
.meter > span { grid-column: 1 / -1; }
.bar { height: 7px; border-radius: 7px; background: var(--surface-3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 7px; background: var(--grad-meter); transition: width .6s ease; }
.bar.off i { background: none; }
.triple { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; border-block-start: 1px solid var(--line); padding-block-start: 6px; }
.triple small { display: block; color: var(--fg-2); font-size: 12.5px; }
.triple b { font-size: 14px; font-weight: 700; }
.state { display: inline-flex; align-items: center; gap: 6px; height: 23px; padding-inline: 8px; border-radius: 5px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.state .i { font-size: 15px; }
.state.good { background: var(--good-bg); color: var(--good); }
.state.warn { background: var(--warn-bg); color: var(--warn); }
.state.bad { background: var(--bad-bg); color: var(--bad); }
.state.idle { background: var(--surface-3); color: var(--fg-2); }
.epg-mini { display: grid; gap: 1px; }
.epg-mini button { display: flex; align-items: center; gap: 22px; min-height: 31px; padding-inline: 21px 12px; border-radius: 6px; text-align: start; font-size: 14px; transition: background .12s; }
.epg-mini button:hover { background: var(--surface-2); }
.epg-mini button span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.epg-mini button.on { background: var(--grad); color: var(--on-accent); }
.epg-mini .i { font-size: 15px; }
[dir="rtl"] .epg-mini .i { transform: scaleX(-1); }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px 14px; }
.tool { display: grid; justify-items: center; align-content: center; gap: 4px; height: 62px; padding: 6px 2px 5px; border-radius: 10px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line), inset 0 -10px 16px -14px var(--accent); font-size: 13px; transition: background .15s, box-shadow .15s, transform .12s; }
.tool .i { font-size: 25px; color: var(--fg); }
.tool:hover { background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--edge-a), inset 0 -10px 18px -12px var(--accent); transform: translateY(-1px); }
.tool .i.c-rec { color: #ff4152; }
.tool .i.c-star { color: var(--star); fill: var(--star); }
.tool .i.c-acc { color: color-mix(in srgb, var(--accent) 70%, white 30%); }
.tool[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px #ff4152; }

/* Status strip */
.status { position: relative; display: flex; align-items: center; gap: 14px; height: 40px; margin-inline: 12px; padding-inline: 0 20px; font-size: 14px; white-space: nowrap; overflow: hidden; }
.status::after { content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, transparent 2%, var(--accent) 12%, var(--accent-2) 20%, transparent 42%); opacity: .8; }
.status .sp { flex: 1; }
.st-std { height: 28px; padding-inline: 12px; display: inline-grid; place-items: center; border-radius: 6px; background: var(--grad-soft); box-shadow: inset 0 0 0 1px var(--edge-a); }
.st-meter { display: inline-flex; align-items: center; gap: 10px; }
.st-meter .bar { width: 86px; height: 6px; }
.st-meter .bar i { background: var(--grad); }
.st-meter.ram .bar i { background: linear-gradient(90deg, #d04ce0, var(--accent)); }
.st-rate { display: inline-flex; align-items: center; gap: 8px; }
.st-rate .i { font-size: 19px; color: var(--good); }
.st-rate.up .i { color: var(--accent-2); }
.state-btn { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding-inline: 10px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font-weight: 600; font-size: 13px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 40%, transparent); }
.state-btn .i { font-size: 14px; }
.state-btn:hover { background: color-mix(in srgb, var(--warn) 26%, transparent); }

/* Shared controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding-inline: 14px; border-radius: var(--r-ctl); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: background .15s, box-shadow .15s, transform .1s, opacity .15s; }
.btn .i { font-size: 17px; }
.btn:hover:not(:disabled) { background: var(--surface-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; }
.btn.primary { background: var(--grad); color: var(--on-accent); box-shadow: 0 0 16px var(--glow), inset 0 1px 0 rgba(255, 255, 255, .2); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.1); background: var(--grad); }
.btn.danger { color: var(--bad); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bad) 50%, transparent); background: var(--bad-bg); }
.btn.sm { min-height: 30px; padding-inline: 10px; font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.row.nw { flex-wrap: nowrap; }
.sp { flex: 1; }
.field { display: grid; gap: 5px; min-width: 0; align-content: start; }
.field .err:empty, .field .ok:empty { display: none; }
.grid2 > .field, .grid3 > .field { align-self: start; }
.field > span, .lbl { font-size: 12.5px; color: var(--fg-2); font-weight: 500; }
.field input, .field select, .field textarea, select.sel { width: 100%; min-height: 36px; padding: 7px 10px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--field); outline: 0; transition: border-color .15s, box-shadow .15s; }
.field select, select.sel { -webkit-appearance: none; appearance: none; padding-inline-end: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--fg-2) 50%), linear-gradient(135deg, var(--fg-2) 50%, transparent 50%); background-size: 5px 5px; background-repeat: no-repeat; background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px; }
[dir="rtl"] .field select, [dir="rtl"] select.sel { background-position: 15px 16px, 10px 16px; }
select option { background: var(--surface-solid); color: var(--fg); }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.field input[aria-invalid="true"] { border-color: var(--bad); }
.field .err { color: var(--bad); font-size: 12px; min-height: 16px; }
.field .ok { color: var(--good); font-size: 12px; min-height: 16px; }
.hint { color: var(--fg-3); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 26px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.switch i { position: absolute; inset: 0; border-radius: 22px; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--line-2); transition: background .18s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-2); transition: inset-inline-start .18s, background .18s; }
.switch input:checked + i { background: var(--grad); box-shadow: 0 0 10px var(--glow); }
.switch input:checked + i::after { inset-inline-start: 19px; background: #fff; }
.switch input:focus-visible + i { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.set-row { display: flex; align-items: center; gap: 16px; min-height: 46px; padding-block: 8px; border-block-end: 1px solid var(--line); }
.set-row:last-child { border-block-end: 0; }
.set-row > div:first-child { flex: 1; min-width: 0; }
.set-row b { font-weight: 600; display: block; }
.set-row small { color: var(--fg-2); }
.set-row .ctl { flex: 0 0 auto; width: min(240px, 46%); display: flex; justify-content: flex-end; }
.set-row .ctl.free { width: auto; }

/* Pages */
.page { display: flex; flex-direction: column; gap: 12px; height: 100%; min-height: 0; }
.page-head { display: flex; align-items: center; gap: 14px; padding: 12px 18px; flex-wrap: wrap; }
.page-head .ph-ic { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; font-size: 24px; background: var(--grad-soft); box-shadow: inset 0 0 0 1px var(--edge-a); color: color-mix(in srgb, var(--accent) 60%, var(--fg) 40%); flex: none; }
.page-head h1 { font: 600 23px/1.15 var(--font-display); }
.page-head p { color: var(--fg-2); font-size: 13.5px; }
.page-head .titles { flex: 1 1 240px; min-width: 0; }
.panes { display: grid; gap: 12px; flex: 1; min-height: 0; }
.pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 14px var(--pad); gap: 11px; }
.pane > .scroll, .pane > .tbl-wrap { flex: 1; min-height: 0; }
.tbl-wrap { overflow: auto; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.tbl th { position: sticky; top: 0; z-index: 2; text-align: start; font-weight: 600; font-size: 12px; color: var(--fg-2); padding: 7px 8px; background: var(--surface-solid); border-block-end: 1px solid var(--line-2); white-space: nowrap; }
.tbl td { padding: 0 8px; height: var(--row); border-block-end: 1px solid var(--line); white-space: nowrap; }
.tbl tbody tr { transition: background .1s; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tbody tr.sel { background: var(--grad-soft); }
.tbl tr.drop-before td { box-shadow: inset 0 2px 0 var(--accent-2); }
.tbl .acts { display: flex; gap: 2px; justify-content: flex-end; }
.tbl .acts .icon-btn { width: 26px; height: 28px; font-size: 15.5px; }
.icon-btn.flag.on { color: var(--accent-2); background: var(--surface-3); }
.handle { cursor: grab; color: var(--fg-3); font-size: 17px; }
.note { display: flex; gap: 10px; padding: 10px 12px; border-radius: var(--r-ctl); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; color: var(--fg-2); }
.note .i { font-size: 18px; color: var(--accent-2); margin-block-start: 1px; }
.note.warn { background: var(--warn-bg); color: var(--fg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 34%, transparent); }
.note.warn .i { color: var(--warn); }
.stat { display: grid; gap: 2px; padding: 10px 12px; border-radius: var(--r-ctl); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.stat small { color: var(--fg-2); font-size: 12px; }
.stat b { font: 600 19px/1.2 var(--font-display); }
.list-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 11px; border-radius: var(--r-ctl); text-align: start; transition: background .12s; }
.list-item:hover { background: var(--surface-2); }
.list-item.on { background: var(--grad); color: var(--on-accent); box-shadow: 0 0 14px var(--glow); }
.list-item.on small, .list-item.on .sub { color: var(--on-accent); opacity: .85; }
.list-item b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item small { color: var(--fg-2); white-space: nowrap; }
.list-item > div { min-width: 0; flex: 1; }

/* Satellite arc */
.arc { display: block; width: 100%; height: 118px; }
.arc text { fill: var(--fg-2); font-size: 10.5px; font-family: var(--font-body); }
.arc .dot { fill: var(--surface-solid); stroke: var(--accent-2); stroke-width: 2; cursor: pointer; transition: r .15s; }
.arc .dot.on { fill: var(--accent-2); stroke: #fff; }
.arc .lbl-on { fill: var(--fg); font-weight: 600; }

/* Scan */
.scan-ring { position: relative; width: 150px; height: 150px; margin: 2px auto; }
.scan-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.scan-ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 600 31px var(--font-display); }
.spectrum { display: block; width: 100%; height: 86px; border-radius: 8px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); }
.log { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); display: grid; gap: 2px; align-content: start; }
.log span b { color: var(--good); font-weight: 500; }

/* EPG grid */
.epg-grid { position: relative; overflow: auto; flex: 1; min-height: 0; border-radius: var(--r-ctl); box-shadow: inset 0 0 0 1px var(--line); }
.epg-inner { position: relative; }
.epg-times { position: sticky; top: 0; z-index: 4; height: 30px; background: var(--surface-solid); border-block-end: 1px solid var(--line-2); }
.epg-times span { position: absolute; top: 7px; font-size: 12px; color: var(--fg-2); padding-inline-start: 6px; }
.epg-row { position: relative; height: 54px; border-block-end: 1px solid var(--line); }
.epg-ch { position: sticky; inset-inline-start: 0; z-index: 3; width: 176px; height: 100%; display: flex; align-items: center; gap: 8px; padding-inline: 10px; background: var(--surface-solid); border-inline-end: 1px solid var(--line-2); font-size: 13px; text-align: start; }
.epg-ch span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

      id: 'ch' + (i + 1), lcn: i + 1, name, code, num, kind, q, p1, p2,
      type: radio ? 'radio' : 'tv', sat, tp: i % 4,
      vcodec: radio ? '' : q === '4K' ? 'H.265' : hd ? 'H.264' : 'MPEG-2',
      acodec: i % 3 === 0 ? 'AC3' : i % 3 === 1 ? 'AAC' : 'MPEG Audio',

/* Time formatting uses the viewer's clock, so now/next is always current. */
const locale = () => (S.lang === 'ar' ? 'ar-MA-u-nu-latn' : 'en-GB');

/* Sample EPG, generated from the current date so now/next and progress stay truthful to the clock. */
const EPG_CACHE = {};
function epgFor(ch) {
  if (NATIVE || !ch) return [];
  const dayKey = new Date().toDateString() + ch.id;
  if (EPG_CACHE[dayKey]) return EPG_CACHE[dayKey];
  const titles = EPG_TITLES[ch.kind] || EPG_TITLES.news;
  const seed = parseInt(ch.id.slice(2), 10) || 1;
  const list = [];
  const durs = [60, 90, 45, 120, 30, 60];
  let t;
  if (ch.id === 'ch1') { t = Math.floor(Date.now() / 72e5) * 72e5 - 864e5 / 4; }
  else { const d = new Date(); d.setHours(0, 0, 0, 0); t = d.getTime() - 3 * 36e5; }
  const end = Date.now() + 2 * 864e5;
  let i = 0;
  while (t < end) {
    const dur = ch.id === 'ch1' ? [120, 60, 60, 60][i % 4] : durs[(i + seed) % durs.length];
    const title = ch.id === 'ch1' ? titles[i % 4] : titles[(i * 5 + seed) % titles.length];
    list.push({ id: `${ch.id}-${t}`, ch: ch.id, title, start: t, end: t + dur * 6e4, desc: EPG_DESC });
    t += dur * 6e4; i++;
  }
  EPG_CACHE[dayKey] = list;
  return list;
}
function nowNext(ch, n = 2) {
  const list = epgFor(ch), now = Date.now();
  const i = list.findIndex(p => p.end > now);
  return list.slice(Math.max(0, i), i + n);
}

const Audio_ = (() => {
  let ac = null, gain = null;
  function init() {
    if (ac) return;

      const len = ac.sampleRate * 3, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      let b = 0; for (let i = 0; i < len; i++) { b = .985 * b + .015 * (Math.random() * 2 - 1); d[i] = b * 3.2; }

  }
  return {
    sync() {
      const p = S.player, on = !p.muted && p.playing && S.mode === 'live';

      if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); gain.gain.setTargetAtTime(on ? p.vol / 100 * .5 : 0, ac.currentTime, .05); }

})();

  if (e.target.matches?.('input,select,textarea') || modals.length || S.view !== 'live') return;

const lonOf = s => (s.dir === 'W' ? -s.pos : s.pos);

function arcSVG() {
  const X = l => 40 + (clamp(l, -70, 70) + 70) / 140 * 820;
  const Y = x => 92 - 56 * (1 - Math.pow((x - 450) / 440, 2));
  const pts = []; for (let x = 40; x <= 860; x += 10) pts.push(`${x},${Y(x).toFixed(1)}`);
  const cur = curSat();
  return `<svg class="arc" viewBox="0 0 900 118" role="img" aria-label="${t('Orbital positions')}">
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--line-2)" stroke-width="1.5" stroke-dasharray="3 5"/>
    ${[-60, -30, 0, 30, 60].map(l => `<g><line x1="${X(l)}" x2="${X(l)}" y1="${Y(X(l)) - 5}" y2="${Y(X(l)) + 5}" stroke="var(--line-2)"/><text x="${X(l)}" y="112" text-anchor="middle">${Math.abs(l)}°${l < 0 ? 'W' : l > 0 ? 'E' : ''}</text></g>`).join('')}
    ${S.sats.map(s => { const x = X(lonOf(s)), y = Y(x), on = cur?.id === s.id; return `<g><title>${esc(satLabel(s))}</title><circle class="dot ${on ? 'on' : ''}" cx="${x}" cy="${y}" r="${on ? 7 : 5}" data-act="sat-pick" data-v="${s.id}"/>${on ? `<text class="lbl-on" x="${x}" y="${y - 13}" text-anchor="middle">${esc(s.name)}</text>` : ''}</g>`; }).join('')}
  </svg>`;
}
SCREENS.satellites = () => {

const hexOnly = v => v.replace(/[\s-]/g, '').toUpperCase();
function bissCheck(raw) {
  const k = hexOnly(raw);
  if (!k) return { ok: false, msg: 'Enter a key.' };
  if (!/^[0-9A-F]+$/.test(k)) return { ok: false, msg: 'Use only 0-9 and A-F.' };
  if (k.length !== 12 && k.length !== 16) return { ok: false, msg: 'A BISS key has 12 or 16 hex digits.' };
  const b = k.match(/../g).map(x => parseInt(x, 16));

  const good = b[3] === sum(b) && b[7] === sum(b.slice(4));
  return { ok: true, key: k, warn: !good, msg: good ? 'Format and checksum are valid.' : 'Format is valid, but the checksum bytes do not match. Check the key.' };
}

const shown = new Set();
SCREENS.biss = () => `<div class="page">${pageHead('key', 'BISS Manager', 'Keys for fixed-key feeds you are authorized to receive.', `<button class="btn" data-act="biss-import">${ic('upload')}${t('Import')}</button><button class="btn" data-act="biss-export" ${S.biss.length ? '' : 'disabled'}>${ic('download')}${t('Export')}</button><button class="btn primary" data-act="biss-add">${ic('plus')}${t('Add key')}</button>`)}
  <section class="card pane" style="flex:1"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('Name')}</th><th>${t('Key')}</th><th>${t('Linked to')}</th><th>${t('Status')}</th><th></th></tr></thead><tbody>
    ${S.biss.map(b => { const c = bissCheck(b.key); return `<tr><td>${esc(b.label)}</td><td class="mono ltr">${shown.has(b.id) ? fmtKey(b.key) : maskKey(b.key)}</td><td>${esc(bissTarget(b.target))}</td><td>${c.warn ? stateTag('warn', 'Check key') : stateTag('idle', 'Format valid, not tested on air')}</td>

    <div class="note">${ic('shield')}<div>${t(NATIVE ? 'This build checks and stores the key format only. It does not decode channels yet.' : 'NOVA checks the key format here. Whether a key decodes depends on an authorized descrambler in your card or CAM. The Windows app encrypts stored keys.')}</div></div></section></div>`;

    let added = 0;
    scan.found.forEach(f => {
      if (S.channels.some(c => c.sat === sat.id && c.f === f.tp.freq && c.p === f.tp.pol && c.sid === f.sid)) return;
      if (!sat.tps.some(p => p.freq === f.tp.freq && p.pol === f.tp.pol)) sat.tps.push({ id: uid('tp'), ...f.tp });
      const radio = f.type === 'radio', hd = SVC_HD.includes(f.svcType);
      const words = f.name.replace(/[^\p{L}\p{N} ]/gu, '').trim().split(/\s+/);
      S.channels.push({ id: uid('ch'), lcn: S.channels.length + 1, name: f.name, provider: f.provider || '', code: words.slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || 'TV', num: '', kind: radio ? 'radio' : 'news', q: radio ? 'R' : f.svcType === 0x1F ? '4K' : hd ? 'HD' : 'SD', p1: '#3a4678', p2: '#1d2547', type: f.type, sat: sat.id, f: f.tp.freq, p: f.tp.pol, tp: 0,
        vcodec: f.video?.codec || '', acodec: f.audio[0]?.codec || '', res: '', kbps: 0, sid: f.sid, tsid: f.tsid, vpid: f.video?.pid || 0, apid: f.audio[0]?.pid || 0,
        audio: f.audio.map(a => a.lang || a.codec), subs: f.subs.map(a => a.lang), fta: f.fta, fav: [], locked: false, hidden: false });
      added++;
    });
    scan.found = []; save(); refresh(); toast(`${added} ${t('channels saved to your list')}`, 'good');
  };

  /* ---------- DiSEqC motor, DiSEqC 1.2 ---------- */
  const MOTOR = { 'Move west': 'E0316900', 'Move east': 'E0316800', 'Stop motor': 'E03160', 'Go to reference': 'E0316B00' };
  A.motor = el => {
    const name = el.dataset.v;
    if (name === 'Store position') {
      const id = uid('mp'), sat = curSat();
      A[id] = () => {
        const m = modals[modals.length - 1], v = Number(formVals(m).pos);
        if (!(v >= 1 && v <= 255)) { setErr(m, 'pos', t('Enter a position from 1 to 255.')); return; }
        engine('diseqc', { hex: 'E0316A' + v.toString(16).toUpperCase().padStart(2, '0') });
        sat.motorPos = v; save(); closeModal(); toast(`${t('Store position')}: ${sat.name} = ${v}`, 'good');
      };
      openModal({ title: `${t('Store position')}: ${sat?.name || ''}`, width: 380, body: field('Motor position (1 to 255)', 'pos', sat?.motorPos || 1, 'inputmode="numeric"'), foot: `<button class="btn" data-act="modal-close">${t('Cancel')}</button><button class="btn primary" data-act="${id}">${t('Save')}</button>` });
      return;
    }
    if (!Engine.opened) { toast(t('Motor commands need a connected tuner.'), 'warn'); return; }
    engine('diseqc', { hex: MOTOR[name] });
  };

  /* ---------- Recording ---------- */
  A['toggle-rec'] = () => {
    if (S.mode !== 'live') { toast(t('Recording needs a tuner with a locked signal.'), 'warn'); return; }
    if (!Engine.recording) { post({ cmd: 'recPath', folder: S.settings.recFolder, title: curCh().name }); return; }
    engine('recStop');
    const c = curCh(), mins = Math.max(1, Math.round((Date.now() - Engine.recStart) / 6e4));
    S.recordings.unshift({ id: uid('r'), title: c.name, ch: c.id, at: Engine.recStart, mins, gb: +((Engine.signal?.bitrateKbps || 0) * mins * 60 / 8e6).toFixed(2), path: Engine.recPath });
    Engine.recording = false; recording = null; save(); toast(t('Recording saved to Recordings'), 'good');
    if (S.view === 'live') { renderPlayer(); renderCards(); }
  };
  A['rec-play'] = el => { const r = S.recordings.find(x => x.id === el.dataset.v); if (r?.path) { go('live'); post({ cmd: 'playFile', path: r.path }); S.player.playing = true; } };

  /* ---------- Window and files ---------- */
  A['win-min'] = () => post({ cmd: 'windowMin' });
  A['win-max'] = () => post({ cmd: 'windowMax' });
  const reallyClose = () => { save(); post({ cmd: 'saveState', state: JSON.parse(JSON.stringify(S, secretFilter)) }); post({ cmd: 'windowClose' }); };
  A['win-close'] = () => {
    if (S.settings.confirmExit) confirmBox({ title: t('Close NOVA DVB Studio?'), msg: Engine.recording ? t('A recording is running. Closing stops it.') : t('Playback stops and the tuner is released.'), yes: t('Close'), onYes: reallyClose });
    else reallyClose();
  };
  A.about = () => openModal({ title: 'NOVA DVB Studio', width: 480, body: `<dl class="kv dl-plain"><dt>${t('Version')}</dt><dd class="ltr">0.1.0</dd><dt>${t('Tuner')}</dt><dd>${esc(Engine.name || t('No tuner'))}</dd><dt>${t('Extension')}</dt><dd>${esc(Engine.caps?.extension || '—')}</dd><dt>${t('Icons')}</dt><dd>Lucide (ISC)</dd><dt>${t('Video')}</dt><dd>LibVLC (LGPL)</dd></dl>`, foot: `<button class="btn" data-act="logs">${t('Open log folder')}</button><button class="btn primary" data-act="modal-close">${t('Close')}</button>` });
  A.logs = () => post({ cmd: 'openLogs' });
  saveFile = async (filename, text) => post({ cmd: 'saveFile', name: filename, text });
  A['srv-test'] = () => toast(t('Connection test arrives with the CAM stage.'), 'warn');
  A['pick-folder'] = el => post({ cmd: 'pickFolder', key: el.dataset.v });

  /* ---------- Settings: devices ---------- */
  CAT_BODY.devices = () => {
    const rows = Engine.tuners.map(tn => `<div class="stat" style="gap:6px"><div class="row nw"><b class="sp">${esc(tn.name)}</b>${Engine.opened && Engine.index === tn.index ? stateTag('good', 'In use') : `<button class="btn sm" data-act="open-tuner" data-v="${tn.index}">${t('Use this tuner')}</button>`}</div><span class="sub">${esc(tn.maker || t('Maker not reported'))}</span></div>`).join('');
    const c = Engine.caps;
    const yes = v => stateTag(v ? 'good' : 'idle', v ? 'Reported' : 'Not reported');
    return `${rows || `<div class="empty">${ic('unplug')}<b>${t('No DVB devices found')}</b><span>${t('Connect a card and install its BDA driver, then detect again.')}</span></div>`}
      <div class="row"><button class="btn sm" data-act="detect2">${ic('refresh')}${t('Detect again')}</button></div>
      ${c ? `<div class="set-h">${t('Reported by this tuner')}</div>
      ${sRow('Maker extension', '', `<span class="ltr">${esc(c.extension)}</span>`, true)}${sRow('DiSEqC messages', '', yes(c.rawDiseqc), true)}${sRow('LNB power control', '', yes(c.lnbPowerControl), true)}${sRow('22 kHz control', '', yes(c.toneControl), true)}${sRow('DVB-S2 parameters', '', yes(c.dvbs2Params), true)}` : ''}`;
  };
  A['open-tuner'] = el => { S.settings.device = el.dataset.v; save(); engine('open', { index: Number(el.dataset.v) }); };

  /* ---------- Events from the engine and the app ---------- */
  function setMode(m) {
    if (S.mode === m) return;
    S.mode = m;
    if (S.view === 'live') { renderPlayer(); renderList(true); renderNow(); renderCards(); } else if (S.view === 'scan') refresh();
    renderStatus();
  }
  function onDevices(m) {
    Engine.tuners = m.tuners || [];
    if (!Engine.tuners.length) {
      Engine.opened = false; setMode('nodevice');
      if (S.view === 'preferences') refresh();
      toast(t('No DVB tuner was found on this computer.'), 'warn');
      return;
    }
    if (!Engine.opened && !Engine.opening) { const want = Number(S.settings.device); Engine.opening = true; engine('open', { index: Number.isInteger(want) && Engine.tuners[want] ? want : 0 }); }
    if (S.view === 'preferences') refresh();
  }
  function onSignal(m) {
    Engine.signal = m;
    const now = Date.now();
    if (Engine.lastTune) {
      if (m.locked) { Engine.lockWait = 0; setMode('live'); }
      else if (now > Engine.lockWait) {
        setMode('lost');
        if (S.settings.reconnect && now > Engine.retryAt) { Engine.retryAt = now + Number(S.settings.reconnectSec || 5) * 1000; engine('tune', Engine.lastTune); }
      }
    }
    updateSignalView();
  }
  function updateSignalView() {
    const m = Engine.signal, set = (id, v) => { const e = $('#' + id); if (e) e.textContent = v; }, w = (id, v) => { const e = $('#' + id); if (e) e.style.width = v + '%'; };
    if (!m) return;
    const q = m.quality, st = m.strength;
    set('m-qv', q == null ? '—' : `${q}%`); w('m-q', q == null ? 0 : clamp(q, 0, 100));
    set('m-sv', st == null ? '—' : String(st)); w('m-s', st == null ? 0 : clamp(st, 0, 100));
    set('st-down', `${(m.bitrateKbps / 1000).toFixed(2)} Mb/s`);
  }
  function onStats(m) {
    Engine.stats = m;
    const set = (id, v) => { const e = $('#' + id); if (e) e.textContent = v; }, w = (id, v) => { const e = $('#' + id); if (e) e.style.width = v + '%'; };
    if (m.cpu != null) { set('st-cpu', `${m.cpu}%`); w('st-cpu-b', m.cpu); }
    if (m.ram != null) { set('st-ram', `${m.ram}%`); w('st-ram-b', m.ram); }
    set('st-disk', `${m.drive} ${m.freeGb} GB`);
  }
  window.chrome.webview.addEventListener('message', e => {
    const m = e.data;
    switch (m.evt) {
      case 'ready': engine('list'); break;
      case 'devices': onDevices(m); break;
      case 'opened': Engine.opening = false; Engine.opened = true; Engine.name = m.name; Engine.caps = m.capabilities; Engine.index = Number(S.settings.device) || 0; Engine.lastTune = null; setMode('ready'); renderStatus(); if (S.view === 'preferences') refresh(); toast(`${t('Tuner ready')}: ${m.name}`, 'good'); if (S.settings.startup === 'last' && S.channels.length && chById(S.player.ch)) tune(S.player.ch); break;
      case 'closed': Engine.opened = false; setMode('nodevice'); break;
      case 'signal': onSignal(m); break;
      case 'scanResult': onScanResult(m); break;
      case 'stats': onStats(m); break;
      case 'tracks': showTracks(m); break;
      case 'recPath': Engine.recPath = m.path; engine('recStart', { path: m.path }); Engine.recording = true; Engine.recStart = Date.now(); recording = { ch: S.player.ch, at: Date.now() }; if (S.view === 'live') { renderPlayer(); renderCards(); } toast(`${t('Recording')}: ${curCh().name}`, 'good'); break;
      case 'diseqcResult': toast(t(m.ok ? 'DiSEqC command sent' : 'The driver refused the DiSEqC command'), m.ok ? 'good' : 'bad'); break;
      case 'fileSaved': toast(`${t('Saved')} ${m.path}`, 'good'); break;
      case 'folderPicked': S.settings[m.key] = m.path; save(); refresh(); break;
      case 'player': if (m.state === 'error') toast(t('The player could not open this stream.'), 'bad'); break;
      case 'engineExit': Engine.opening = false; Engine.opened = false; Engine.lastTune = null; setMode('nodevice'); toast(t('The tuner engine stopped. Restarting it.'), 'bad'); setTimeout(() => engine('list'), 1500); break;
      case 'error': if (m.cmd === 'open') Engine.opening = false; toast(m.message || t('The tuner reported an error.'), 'bad'); break;
    }
  });

  /* ---------- Keeping the video window over the picture ---------- */
  let lastRect = '';
  function reportVideo() {
    const stage = $('#stage'), overlay = $('#stage-over')?.children.length;
    const show = !!stage && S.view === 'live' && S.layout.video && !overlay && !modals.length && !popEl && S.player.playing && S.mode === 'live' && !document.hidden;
    const r = stage?.getBoundingClientRect(), bar = $('#controls')?.getBoundingClientRect().height || 0;
    const msg = { cmd: 'videoRect', x: r?.left || 0, y: r?.top || 0, w: r?.width || 0, h: Math.max(0, (r?.height || 0) - bar), dpr: window.devicePixelRatio, show };
    const key = JSON.stringify(msg);
    if (key !== lastRect) { lastRect = key; post(msg); }
  }
  setInterval(reportVideo, 120);
  addEventListener('resize', reportVideo);

  /* First contact */
  S.mode = 'nodevice';
  setTimeout(() => post({ cmd: 'uiReady' }), 0);
})();

/* Start-up */
(function boot() {
  const v = location.hash.slice(1);
  if (VIEWS.includes(v)) S.view = v;
  if (!chById(S.player.ch)) S.player.ch = S.channels[0]?.id;
  renderAll();
  renderSkinBar();
  addEventListener('beforeunload', () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S, secretFilter)); } catch (e) { /* see load() */ } });
})();


</script>
</body></html>
